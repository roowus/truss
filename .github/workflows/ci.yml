name: ci

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch: # the audit-fix loop dispatches this on a PR head it pushed (bot pushes do not fire pull_request events)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run lint

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r --if-present run test
