name: ci

# workflow_dispatch: the audit-fix loop dispatches this on a PR head it
# pushed (bot pushes do not fire pull_request events).
on:
  push:
    branches: [main, beta]
  pull_request:
  # (manual dispatch used by the PR audit driver for bot-pushed heads)
  workflow_dispatch:

jobs:
  # Cheap, fast, and runs before anything else: this repo is PUBLIC, so a
  # leaked tailnet hostname / IP / personal path is a disclosure bug, not a
  # style nit. Gating `verify` on it means it cannot be merged past.
  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history is needed for the commit-range scan

      - name: Scan work tree for real infrastructure identifiers
        run: bash scripts/check-pii.sh --all

      - name: Scan commits introduced by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/check-pii.sh --rev "origin/${{ github.base_ref }}...HEAD"

  verify:
    needs: pii-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run lint

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm -r --if-present run test
