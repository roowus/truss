name: pr-audit

# Comment "~run-audit" on a PR (repo owner only) to get an AI audit of the
# diff: bugs, vulnerabilities, convention compliance, plus proportionality /
# test coverage / business-logic-risk assessments. The actual audit lives in
# audit-core.yml (shared with the audit-fix loop); this workflow is just the
# trigger. It posts a started note immediately, and audit-core edits that
# comment into the final report.
#
# Shares a concurrency group with pr-audit-loop.yml so an audit and a fix
# loop never run on the same PR at the same time.
#
# Setup: add the ZAI_API_KEY and FIREWORKS_API_KEY repository secrets. Never
# commit the keys themselves.

on:
  issue_comment:
    types: [created]

concurrency:
  group: truss-audit-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  start:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '~run-audit') &&
      !contains(github.event.comment.body, '~audit-loop') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      comment_id: ${{ steps.ack.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge trigger
        continue-on-error: true
        run: >-
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes

      - name: Read PR metadata
        id: pr
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid > "$RUNNER_TEMP/pr.json"
          echo "head_sha=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Post started note
        id: ack
        run: |
          SHORT="$(echo '${{ steps.pr.outputs.head_sha }}' | cut -c1-7)"
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body="🔍 Audit running on head \`$SHORT\` — this comment will be replaced by the report when it lands. ([run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" \
            --jq .id > "$RUNNER_TEMP/ack-id"
          echo "comment_id=$(cat "$RUNNER_TEMP/ack-id")" >> "$GITHUB_OUTPUT"

  audit:
    needs: start
    uses: ./.github/workflows/audit-core.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.start.outputs.head_sha }}
      round_label: ""
      edit_comment_id: ${{ needs.start.outputs.comment_id }}
