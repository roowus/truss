            --add-dir ${{ runner.temp }}/review-out
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Write,Glob,Grep"

      - name: Audit round 3 (Kimi fallback)
        id: audit-r3-fb
        if: steps.finish-r2.outputs.signal == 'continue' && steps.audit-r3.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ env.FW_BASE_URL }}
