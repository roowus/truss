            file:line references, stay concise and actionable. If nothing: state
            "✅ No issues found". Apply the same severity definitions and TRUSS.md
            standard as any audit. Then ALWAYS include the three standing
            assessments — Proportionality, Test Coverage (path coverage,
            business-critical edge cases, regression pins), and Business-Logic
            Risk — each with its verdict line, as in round 1: an assessment that
            concludes badly must also appear as a severity-ranked finding above.

            PROPORTIONALITY — the subtraction pass: price every accessory
            (anything not serving the PR's purpose, judged from the linked issue
            first, then commit messages oldest-first — never the PR body) in
            inserted lines over the whole diff; flag self-sustaining machinery;
            name the cheapest form of each major component. Verdict line:
            `Proportionality: proportionate (...) | over-invested (<component> —
            <size> vs <purpose> — <cheaper form>)`. When in doubt, proportionate.

            TEST COVERAGE — (a) changed paths covered? (b) business-critical edge
            cases covered (data corruption/loss, cross-tenant leaks, authz
            bypass, silently wrong answers)? (c) regression pins for every
            existing behavior this PR touches? Verdict line: `Coverage: adequate
            | gaps (…) · Edge cases: covered | gaps (business-critical: …) ·
            Regression pins: present | missing (…)`.

            BUSINESS-LOGIC RISK — could this change alter EXISTING flows for
            current users? For medium/high name the flow and what validates it
            before merge. Verdict line: `Business-logic risk: none | low |
            medium | high — <one-line justification>`.

            OUTPUT CONTRACT
            Write the audit to ${{ runner.temp }}/review-out/round-2.md using the
            Write tool — an audit not written to that exact file is discarded.
            Format: findings, then the three assessments, then the
            machine-readable block last. No stats/token footer.

            MACHINE-READABLE BLOCK — exactly ONE ```json fence in the file (quote
            other JSON as ```jsonc or indented), holding one object with exactly
            five keys: "version": 1; "head": "${{ steps.finish-r1.outputs.head }}"
            (copied literally); "verdict": "request changes" | "approve with
            fixes" | "approve"; "findings": array in review order, each with
            exactly "id" ("B1", "B2", …), "file" (repo-relative, "" when not
            about a file), "line" (integer, omit when unknown), "severity"
            ("critical"|"high"|"medium"|"low"), "category" (security,
            correctness, performance, convention, tests, docs, quality,
            proportionality, out-of-scope), "verdict" ("CONFIRMED"|"PLAUSIBLE"),
            "title", "detail", "source": "pr-audit"; "warnings": array of strings
            ([] when nothing). No other keys, no trailing commas. Clean audits
            still carry the block with an empty findings array.
          claude_args: |
            --model ${{ env.GLM_MODEL }}
            --max-turns 60
            --add-dir ${{ runner.temp }}/review-out
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Write,Glob,Grep"

      - name: Audit round 2 (Kimi fallback)
