name: pr-audit-loop

# Comment "~audit-loop" on a PR (repo owner only) to start the audit-fix loop.
# Each run performs ONE round — audit (audit-core.yml) → validate and fix
# (fix-core.yml) → push — and then re-dispatches itself for the next round
# until an audit finds no critical/high findings. Rounds are therefore not
# hardcoded: the loop cycles for as many rounds as it needs, bounded by
# MAX_ROUNDS below. (workflow_dispatch is the one event GITHUB_TOKEN may
# trigger, which is what makes the self-chain possible.)
#
# State passes from run to run as dispatch inputs: round number, the started
# note's comment id, a hash of the last round's major findings, the no-
# progress streak, and whether any round pushed commits.
#
# Models: primary is GLM via Z.AI. Fallback to Kimi via Fireworks happens two
# ways:
#   1. any agent job that fails on GLM (for example out of credits) retries
#      the same round once on Kimi (inside the core workflows);
#   2. if 3 consecutive rounds report identical critical/high findings (the
#      same issues are not getting solved), the fixer switches to Kimi until
#      the streak breaks.
#
# Safety:
# - Owner-comment trigger only; runs only on same-repo PR heads (the fixer
#   installs dependencies and runs the PR's own code).
# - Shares the truss-audit-<pr> concurrency group with pr-audit.yml, so at
#   most one audit/loop run per PR at a time. A queued self-dispatch starts
#   the moment the dispatching run releases the group, and a duplicate
#   comment trigger queues instead of interrupting.
# - The fixer commits; a workflow-owned step pushes, refspec-pinned to the PR
#   branch. The agent never edits .github/workflows/**.
#
# Setup: add the ZAI_API_KEY and FIREWORKS_API_KEY repository secrets. Never
# commit the keys themselves.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      round:
        type: string
        default: "1"
      comment_id:
        type: string
        default: ""
      last_majors:
        description: sha256 of the previous round's major-finding titles
        type: string
        default: ""
      stale:
        description: consecutive rounds with identical majors
        type: string
        default: "0"
      pushed:
        description: "1 once any round pushed commits"
        type: string
        default: "0"

concurrency:
  group: truss-audit-${{ github.event.inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

env:
  MAX_ROUNDS: 10

jobs:
  check:
    # Round 1 comes from an owner comment; later rounds from self-dispatch.
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '~audit-loop') &&
        github.event.comment.author_association == 'OWNER') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      base_ref: ${{ steps.gate.outputs.base_ref }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.issue.number }}
    steps:
      - name: Acknowledge trigger
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        run: >-
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes

      - name: Gate on same-repo head
        id: gate
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid,headRefName,baseRefName,isCrossRepository \
            > "$RUNNER_TEMP/pr.json"
          echo "head_sha=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "comment_id=${{ github.event.inputs.comment_id }}" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")" = "true" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "🔁 Audit-fix loop skipped: it only runs on same-repo PRs (the fix stage installs dependencies and runs the PR's own code)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "issue_comment" ]; then
              gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                -f body="🔁 Audit-fix loop running — this comment becomes the summary when the loop ends. Each round's audit and wrap-up post as they land. ([run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" \
                --jq .id > "$RUNNER_TEMP/ack-id"
              echo "comment_id=$(cat "$RUNNER_TEMP/ack-id")" >> "$GITHUB_OUTPUT"
            fi
          fi

  audit:
    needs: check
    if: needs.check.outputs.ok == 'true'
    uses: ./.github/workflows/audit-core.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.inputs.pr_number || github.event.issue.number }}
      head_sha: ${{ needs.check.outputs.head_sha }}
      round_label: ${{ github.event.inputs.round || '1' }}

  # Compare this round's majors against the previous round's: identical 3
  # times in a row means GLM is not making progress, so the fixer switches
  # to Kimi until the streak breaks.
  decide:
    needs: [check, audit]
    if: always() && needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.d.outputs.stale }}
      majors_hash: ${{ steps.d.outputs.majors_hash }}
      provider: ${{ steps.d.outputs.provider }}
    env:
      MAJORS: ${{ needs.audit.outputs.majors }}
      LAST: ${{ github.event.inputs.last_majors }}
      STALE_IN: ${{ github.event.inputs.stale || '0' }}
    steps:
      - id: d
        run: |
          CUR=$(printf '%s' "$MAJORS" | sha256sum | cut -d' ' -f1)
          STALE="$STALE_IN"
          if [ -n "$MAJORS" ] && [ "$CUR" = "$LAST" ]; then
            STALE=$((STALE + 1))
          else
            STALE=0
          fi
          PROVIDER=zai
          [ "$STALE" -ge 3 ] && PROVIDER=fireworks
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"
          echo "majors_hash=$CUR" >> "$GITHUB_OUTPUT"
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

  fix:
    needs: [check, audit, decide]
    if: needs.audit.outputs.signal == 'continue'
    uses: ./.github/workflows/fix-core.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.inputs.pr_number || github.event.issue.number }}
      round: ${{ github.event.inputs.round || '1' }}
      base_ref: ${{ needs.check.outputs.base_ref }}
      head_ref: ${{ needs.check.outputs.head_ref }}
      provider: ${{ needs.decide.outputs.provider }}

  # Either dispatch the next round or write the final summary (and get CI
  # running on the pushed head).
  next:
    needs: [check, audit, decide, fix]
    if: always() && needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.issue.number }}
      ROUND: ${{ github.event.inputs.round || '1' }}
      CID: ${{ needs.check.outputs.comment_id }}
      HEAD_REF: ${{ needs.check.outputs.head_ref }}
      A_VERDICT: ${{ needs.audit.outputs.verdict }}
      A_SIG: ${{ needs.audit.outputs.signal }}
      A_C: ${{ needs.audit.outputs.critical }}
      A_H: ${{ needs.audit.outputs.high }}
      F_SIG: ${{ needs.fix.outputs.signal }}
      F_F: ${{ needs.fix.outputs.fixed }}
      F_REF: ${{ needs.fix.outputs.refuted }}
      F_DEC: ${{ needs.fix.outputs.declined }}
      STALE: ${{ needs.decide.outputs.stale }}
      MAJORS_HASH: ${{ needs.decide.outputs.majors_hash }}
      PROVIDER: ${{ needs.decide.outputs.provider }}
      PUSHED_BEFORE: ${{ github.event.inputs.pushed || '0' }}
    steps:
      - name: Continue or conclude the loop
        run: |
          PUSHED="$PUSHED_BEFORE"
          [ "$F_SIG" = "continue" ] && PUSHED=1

          post_or_patch() {
            if [ -n "$CID" ]; then
              python3 -c 'import json, sys; print(json.dumps({"body": open(sys.argv[1]).read()}))' "$1" \
                | gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$CID" --input - > /dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$1"
            fi
          }

          if [ "$A_SIG" = "continue" ] && [ "$F_SIG" = "continue" ] && [ "$ROUND" -lt "$MAX_ROUNDS" ]; then
            # Cycle: dispatch the next round and update the started note.
            gh workflow run pr-audit-loop.yml --repo "${{ github.repository }}" \
              -f pr_number="$PR_NUMBER" -f round=$((ROUND + 1)) -f comment_id="$CID" \
              -f last_majors="$MAJORS_HASH" -f stale="$STALE" -f pushed="$PUSHED"
            {
              echo "🔁 Audit-fix loop: round $ROUND pushed fixes (fixed $F_F, refuted $F_REF, declined $F_DEC) — round $((ROUND + 1)) queued. This comment becomes the summary when the loop ends."
              [ "$PROVIDER" = "fireworks" ] && echo "The fixer is running on Kimi: the last 3 rounds reported identical majors."
              echo
              echo "([run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
            } > "$RUNNER_TEMP/progress.md"
            post_or_patch "$RUNNER_TEMP/progress.md"
            exit 0
          fi

          # Terminal state: build the final summary.
          {
            echo "## 🔁 Audit-fix loop — summary"
            echo
            echo "Rounds run: $ROUND (cap $MAX_ROUNDS) · last audit: ${A_VERDICT:-—} (${A_C:-0} critical / ${A_H:-0} high) · last fix round: ${F_SIG:-—} (fixed ${F_F:-—}, refuted ${F_REF:-—}, declined ${F_DEC:-—})"
            echo
            if [ -z "$A_VERDICT" ]; then
              echo "**Aborted:** this round's audit never produced a report (GLM failed and so did the Kimi fallback). Check the keys, then re-comment the trigger to retry."
            elif [ "$A_SIG" = "error" ]; then
              echo "**Aborted:** this round's audit report was unparseable. See the run logs."
            elif [ "$A_SIG" = "continue" ] && [ -z "$F_SIG" ]; then
              echo "**Aborted:** the fix job failed before producing a result. See the run logs."
            elif [ "$F_SIG" = "abort" ]; then
              echo "**Aborted:** the fix round could not complete. See its wrap-up comment and the run logs."
            elif [ "$F_SIG" = "continue" ]; then
              echo "**Round cap ($MAX_ROUNDS) hit** with fixes still landing. Anything still churning needs a human look before more loops."
            elif [ "$F_SIG" = "converged" ]; then
              echo "**Converged after $ROUND round(s).** The last audit's majors were dispositioned in this round's wrap-up."
            else
              echo "**Converged at round $ROUND** — the audit found no critical/important findings. Minor findings, if any, are listed in the audit above."
            fi
            echo
            if [ "$PUSHED" = "1" ]; then
              # Bot pushes park pull_request CI as action_required (bot
              # approval gate). Approve those runs; if none are parked, fall
              # back to dispatching ci on the head branch directly.
              APPROVED=0
              gh api "repos/${{ github.repository }}/actions/runs?branch=$HEAD_REF&event=pull_request" \
                --jq '.workflow_runs[] | select(.status=="action_required") | .id' \
                | while read -r run_id; do
                    gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/approve" > /dev/null \
                      && APPROVED=1
                  done
              if [ "$APPROVED" = "1" ]; then
                echo "Fixes were pushed; the parked \`ci\` run on the head was approved."
              elif gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$HEAD_REF" 2>/dev/null; then
                echo "Fixes were pushed; \`ci\` was dispatched on the head branch."
              else
                echo "Fixes were pushed; could not start \`ci\` on the head — trigger it manually."
              fi
            else
              echo "No commits were pushed; nothing new for \`ci\` to run."
            fi
            echo
            echo "Merging stays a human decision."
            echo
            echo "_Posted by \`${{ github.workflow }}\` · [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > "$RUNNER_TEMP/summary.md"
          post_or_patch "$RUNNER_TEMP/summary.md"
