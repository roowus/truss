name: pr-audit-loop

# Comment "~audit-loop" on a PR (repo owner only) to run the audit-fix loop:
# audit the head → adversarially validate each major finding → fix the valid
# ones with tests → push → re-audit, up to 3 rounds, until a round finds no
# critical/high findings. Every round posts its audit report and fix wrap-up;
# the loop always ends with a posted summary.
#
# This workflow only orchestrates: the audit lives in audit-core.yml and the
# fixer in fix-core.yml, called directly as jobs (no comment re-triggers).
#
# Models: primary is GLM via Z.AI. Fallback to Kimi via Fireworks happens two
# ways:
#   1. any agent job that fails on GLM (for example out of credits) retries
#      the same round once on Kimi;
#   2. if a round's critical/high findings are identical to the previous
#      round's (no progress — the same issues are not getting solved), the
#      fix stage switches to Kimi for that round.
# 3 rounds is the hard cap: anything still churning then goes to a human.
#
# Safety:
# - Owner-comment trigger only; runs only on same-repo PR heads (the fixer
#   installs dependencies and runs the PR's own code).
# - Shares the truss-audit-<pr> concurrency group with pr-audit.yml, so at
#   most one audit/loop run per PR at a time (cancel-in-progress: false — a
#   second trigger queues instead of interrupting).
# - The fixer commits; a workflow-owned step pushes, refspec-pinned to the PR
#   branch. The agent never edits .github/workflows/**.
#
# Setup: add the ZAI_API_KEY and FIREWORKS_API_KEY repository secrets. Never
# commit the keys themselves.

on:
  issue_comment:
    types: [created]

concurrency:
  group: truss-audit-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '~audit-loop') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      base_ref: ${{ steps.gate.outputs.base_ref }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge trigger
        continue-on-error: true
        run: >-
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes

      - name: Gate on same-repo head
        id: gate
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid,headRefName,baseRefName,isCrossRepository \
            > "$RUNNER_TEMP/pr.json"
          echo "head_sha=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")" = "true" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "🔁 Audit-fix loop skipped: it only runs on same-repo PRs (the fix stage installs dependencies and runs the PR's own code)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "comment_id=" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -f body="🔁 Audit-fix loop running (up to 3 rounds) — this comment will be replaced by the summary when the loop ends. Each round's audit and wrap-up post as they land. ([run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" \
              --jq .id > "$RUNNER_TEMP/ack-id"
            echo "comment_id=$(cat "$RUNNER_TEMP/ack-id")" >> "$GITHUB_OUTPUT"
          fi

  # ---------------- Round 1 ----------------

  audit-r1:
    needs: check
    if: needs.check.outputs.ok == 'true'
    uses: ./.github/workflows/audit-core.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.check.outputs.head_sha }}
      round_label: "1"

  fix-r1:
    needs: [check, audit-r1]
    if: needs.audit-r1.outputs.signal == 'continue'
    uses: ./.github/workflows/fix-core.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      round: "1"
      base_ref: ${{ needs.check.outputs.base_ref }}
      head_ref: ${{ needs.check.outputs.head_ref }}
      provider: zai

  # ---------------- Round 2 ----------------

  audit-r2:
    needs: [check, fix-r1]
    if: needs.fix-r1.outputs.signal == 'continue'
    uses: ./.github/workflows/audit-core.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.fix-r1.outputs.head }}
      round_label: "2"

  fix-r2:
    needs: [check, audit-r1, audit-r2]
    if: needs.audit-r2.outputs.signal == 'continue'
    uses: ./.github/workflows/fix-core.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      round: "2"
      base_ref: ${{ needs.check.outputs.base_ref }}
      head_ref: ${{ needs.check.outputs.head_ref }}
      # No progress on GLM (round 2 majors identical to round 1) → Kimi.
      provider: ${{ needs.audit-r1.outputs.majors != '' && needs.audit-r1.outputs.majors == needs.audit-r2.outputs.majors && 'fireworks' || 'zai' }}

  # ---------------- Round 3 (cap) ----------------

  audit-r3:
    needs: [check, fix-r2]
    if: needs.fix-r2.outputs.signal == 'continue'
    uses: ./.github/workflows/audit-core.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.fix-r2.outputs.head }}
      round_label: "3"

  fix-r3:
    needs: [check, audit-r2, audit-r3]
    if: needs.audit-r3.outputs.signal == 'continue'
    uses: ./.github/workflows/fix-core.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ github.event.issue.number }}
      round: "3"
      base_ref: ${{ needs.check.outputs.base_ref }}
      head_ref: ${{ needs.check.outputs.head_ref }}
      provider: ${{ needs.audit-r2.outputs.majors != '' && needs.audit-r2.outputs.majors == needs.audit-r3.outputs.majors && 'fireworks' || 'zai' }}

  # ---------------- Summary ----------------

  summary:
    needs: [check, audit-r1, fix-r1, audit-r2, fix-r2, audit-r3, fix-r3]
    if: always() && needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      HEAD_REF: ${{ needs.check.outputs.head_ref }}
      CID: ${{ needs.check.outputs.comment_id }}
      A1_VERDICT: ${{ needs.audit-r1.outputs.verdict }}
      A1_SIG: ${{ needs.audit-r1.outputs.signal }}
      A1_C: ${{ needs.audit-r1.outputs.critical }}
      A1_H: ${{ needs.audit-r1.outputs.high }}
      A2_VERDICT: ${{ needs.audit-r2.outputs.verdict }}
      A2_SIG: ${{ needs.audit-r2.outputs.signal }}
      A2_C: ${{ needs.audit-r2.outputs.critical }}
      A2_H: ${{ needs.audit-r2.outputs.high }}
      A3_VERDICT: ${{ needs.audit-r3.outputs.verdict }}
      A3_SIG: ${{ needs.audit-r3.outputs.signal }}
      A3_C: ${{ needs.audit-r3.outputs.critical }}
      A3_H: ${{ needs.audit-r3.outputs.high }}
      F1_SIG: ${{ needs.fix-r1.outputs.signal }}
      F1_F: ${{ needs.fix-r1.outputs.fixed }}
      F1_REF: ${{ needs.fix-r1.outputs.refuted }}
      F1_DEC: ${{ needs.fix-r1.outputs.declined }}
      F2_SIG: ${{ needs.fix-r2.outputs.signal }}
      F2_F: ${{ needs.fix-r2.outputs.fixed }}
      F2_REF: ${{ needs.fix-r2.outputs.refuted }}
      F2_DEC: ${{ needs.fix-r2.outputs.declined }}
      F3_SIG: ${{ needs.fix-r3.outputs.signal }}
      F3_F: ${{ needs.fix-r3.outputs.fixed }}
      F3_REF: ${{ needs.fix-r3.outputs.refuted }}
      F3_DEC: ${{ needs.fix-r3.outputs.declined }}
    steps:
      - name: Post loop summary
        run: |
          {
            echo "## 🔁 Audit-fix loop — summary"
            echo
            echo "| Round | Audit verdict | C/H findings | Fixed | Refuted | Declined | Outcome |"
            echo "|---|---|---|---|---|---|---|"
            for r in 1 2 3; do
              verdict_var="A${r}_VERDICT"; c_var="A${r}_C"; h_var="A${r}_H"
              sig_var="F${r}_SIG"; f_var="F${r}_F"; ref_var="F${r}_REF"; dec_var="F${r}_DEC"
              pv="${!verdict_var}"; pc="${!c_var}"; ph="${!h_var}"
              fs="${!sig_var}"; ff="${!f_var}"; fr="${!ref_var}"; fd="${!dec_var}"
              [ -z "$pv" ] && continue
              echo "| $r | ${pv:-—} | ${pc:-0}/${ph:-0} | ${ff:-—} | ${fr:-—} | ${fd:-—} | ${fs:-${pv:+converged}} |"
            done
            echo
            if [ -z "$A1_VERDICT" ]; then
              echo "**Aborted:** the round 1 audit never produced a report (GLM failed and so did the Kimi fallback, or neither wrote output). Check the Z.AI and Fireworks keys, then re-comment the trigger to retry."
            elif [ "$A1_SIG" = "error" ]; then
              echo "**Aborted:** the round 1 report was unparseable. See the run logs."
            elif [ "$F1_SIG" = "abort" ] || [ "$F2_SIG" = "abort" ] || [ "$F3_SIG" = "abort" ]; then
              echo "**Aborted:** a fix round could not complete. See that round's wrap-up comment and the run logs."
            elif [ "$A2_SIG" = "error" ] || [ "$A3_SIG" = "error" ]; then
              echo "**Aborted:** a later audit report was unparseable. See the run logs."
            elif [ "$F1_SIG" = "continue" ] && [ -z "$A2_VERDICT" ]; then
              echo "**Aborted:** the round 2 audit failed. See the run logs; re-comment the trigger to retry."
            elif [ "$F2_SIG" = "continue" ] && [ -z "$A3_VERDICT" ]; then
              echo "**Aborted:** the round 3 audit failed. See the run logs; re-comment the trigger to retry."
            elif [ "$A1_SIG" = "continue" ] && [ -z "$F1_SIG" ]; then
              echo "**Aborted:** the fix round 1 job failed before producing a result. See the run logs."
            elif [ "$A2_SIG" = "continue" ] && [ -z "$F2_SIG" ]; then
              echo "**Aborted:** the fix round 2 job failed before producing a result. See the run logs."
            elif [ "$A3_SIG" = "continue" ] && [ -z "$F3_SIG" ]; then
              echo "**Aborted:** the fix round 3 job failed before producing a result. See the run logs."
            elif [ "$F3_SIG" = "continue" ]; then
              echo "**Round cap (3) hit** with fixes still landing. Anything still churning after 3 rounds needs a human look before more loops."
            elif [ -n "$F3_SIG" ]; then
              echo "**Converged after 3 rounds.** The last audit's remaining majors were dispositioned in the round 3 wrap-up."
            elif [ -n "$F2_SIG" ]; then
              echo "**Converged after 2 rounds.**"
            elif [ -n "$F1_SIG" ]; then
              echo "**Converged after 1 round of fixes.**"
            else
              echo "**Converged at the first audit** — no critical/important findings. Minor findings, if any, are listed in the audit above."
            fi
            echo
            if [ "$F1_SIG" = "continue" ] || [ "$F2_SIG" = "continue" ] || [ "$F3_SIG" = "continue" ]; then
              # Bot pushes do not fire pull_request events, so dispatch ci on
              # the head the loop pushed.
              gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$HEAD_REF" \
                && echo "Fixes were pushed; \`ci\` was dispatched on the head branch."
            else
              echo "No commits were pushed; nothing new for \`ci\` to run."
            fi
            echo
            echo "Merging stays a human decision."
            echo
            echo "_Posted by \`${{ github.workflow }}\` · [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > "$RUNNER_TEMP/summary.md"
          if [ -n "$CID" ]; then
            python3 -c 'import json, sys; print(json.dumps({"body": open(sys.argv[1]).read()}))' "$RUNNER_TEMP/summary.md" \
              | gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$CID" --input - > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/summary.md"
          fi
